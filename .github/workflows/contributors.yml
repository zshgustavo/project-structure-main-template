name: Update Contributors

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  update-contributors:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add merged PR author to CONTRIBUTORS.md
        id: update
        run: |
          python3 scripts/ci/update_contributors.py "${{ github.event.pull_request.user.login }}" | tee update.log
          if grep -q "Added contributor" update.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md
          git commit -m "chore: add contributor ${{ github.event.pull_request.user.login }} to CONTRIBUTORS.md"
          git push