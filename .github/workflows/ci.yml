name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run lint
        run: ./scripts/ci/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: project_structure_main_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d project_structure_main_template_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: ./scripts/ci/test.sh
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/project_structure_main_template_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build artifacts
        run: ./scripts/ci/build.sh