[project]
name = "project-agent"
version = "0.1.0"
description = "CrewAI multi-agent runtime for project-structure-main-template"
authors = [{ name = "zshgustavo", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,litellm,tools]>=1.14.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
project-agent = "project_agent.main:run"
run_crew = "project_agent.main:run"
test = "project_agent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.hatch.build.targets.wheel]
packages = ["src/project_agent"]